[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pkm-tools"
version = "0.1.0"
description = "PKM mit LLM-Wiki: MCP-Server und CLI"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.scripts]
pkm = "pkm.cli:main"
pkm-mcp = "pkm.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pkm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
