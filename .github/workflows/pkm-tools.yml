name: pkm-tools

on:
  push:
    paths: ["pkm-tools/**", ".github/workflows/pkm-tools.yml"]
  pull_request:
    paths: ["pkm-tools/**", ".github/workflows/pkm-tools.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pkm-tools
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m venv .venv
      - run: ./.venv/bin/pip install -e ".[dev]"
      - run: ./.venv/bin/python -m ruff check .
      - run: ./.venv/bin/python -m pylint --rcfile=.pylintrc src tests
      - run: ./.venv/bin/python -m pytest -q
