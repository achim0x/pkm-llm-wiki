name: pkm-tools

on:
  push:
    paths: ["pkm-tools/**", ".github/workflows/pkm-tools.yml"]
  pull_request:
    paths: ["pkm-tools/**", ".github/workflows/pkm-tools.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pkm-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
