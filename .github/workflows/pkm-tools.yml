name: pkm-tools

on:
  push:
    paths: ["pkm-tools/**", "install.sh", "install.ps1", ".github/workflows/pkm-tools.yml", ".github/workflows/release.yml"]
  pull_request:
    paths: ["pkm-tools/**", "install.sh", "install.ps1", ".github/workflows/pkm-tools.yml", ".github/workflows/release.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pkm-tools
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Create .venv
        run: |
          python -m venv .venv
          if [ -x .venv/Scripts/python.exe ]; then echo "PY=$PWD/.venv/Scripts/python.exe" >> "$GITHUB_ENV"; else echo "PY=$PWD/.venv/bin/python" >> "$GITHUB_ENV"; fi
      - run: '"$PY" -m pip install -e ".[dev]"'
      - run: '"$PY" -m ruff check .'
      - run: '"$PY" -m pylint --rcfile=.pylintrc src tests'
      - run: '"$PY" -m pytest -q'

  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Local release of this commit (stands in for a GitHub release)
        shell: bash
        run: |
          python -m pip install -q build uv
          REL="$RUNNER_TEMP/rel"
          python -m build -q --wheel --outdir "$REL" pkm-tools
          uv pip compile -q --universal --no-header pkm-tools/pyproject.toml -o "$REL/constraints.txt"
          VERSION="v$(python -c "import tomllib; print(tomllib.load(open('pkm-tools/pyproject.toml', 'rb'))['project']['version'])")"
          if command -v sha256sum >/dev/null; then SUM="sha256sum"; else SUM="shasum -a 256"; fi
          SHA=$(cd "$REL" && $SUM pkm_tools-*.whl | cut -d' ' -f1)  # no path: sha256sum escapes backslashes
          (cd "$REL" && $SUM -- pkm_tools-*.whl constraints.txt > SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/stamped"
          for f in install.sh install.ps1; do
            sed -e "s/__PKM_VERSION__/$VERSION/" -e "s/__PKM_WHEEL_SHA256__/$SHA/" "$f" > "$RUNNER_TEMP/stamped/$f"
          done
          cp -r "$REL" "$RUNNER_TEMP/bad"
          for w in "$RUNNER_TEMP"/bad/pkm_tools-*.whl; do printf 'x' >> "$w"; done
          echo "PKM_TEST_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Archive of this commit (stands in for the GitHub download)
        shell: bash
        run: git archive --format=zip --prefix=pkm-llm-wiki-main/ -o "$RUNNER_TEMP/pkm.zip" HEAD
      - name: install.sh (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          PKM_ARCHIVE="file://$RUNNER_TEMP/pkm.zip" sh install.sh --yes --claude-config "$RUNNER_TEMP/claude.json" --vault "$RUNNER_TEMP/vault" \
            --git-name CI --git-email ci@example.org
          "$HOME/.local/bin/pkm" doctor --short
      - name: Release installer install.sh with checksum (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          PKM_VERSION="$PKM_TEST_VERSION" PKM_RELEASE_URL="$RUNNER_TEMP/rel" sh "$RUNNER_TEMP/stamped/install.sh" --yes \
            --claude-config "$RUNNER_TEMP/claude.json" --vault "$RUNNER_TEMP/vault"
          "$HOME/.local/bin/pkm" --version
          if PKM_VERSION="$PKM_TEST_VERSION" PKM_RELEASE_URL="$RUNNER_TEMP/bad" sh "$RUNNER_TEMP/stamped/install.sh" --yes; then
            echo "A tampered wheel was installed"; exit 1
          fi
      - name: install.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:PKM_ARCHIVE = "$env:RUNNER_TEMP\pkm.zip"
          $env:PKM_SETUP_ARGS = "--yes --claude-config $env:RUNNER_TEMP\claude.json --vault $env:RUNNER_TEMP\vault --git-name CI --git-email ci@example.org"
          .\install.ps1
          & "$env:USERPROFILE\.local\bin\pkm.exe" doctor --short
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Release installer install.ps1 with checksum (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:PKM_VERSION = $env:PKM_TEST_VERSION
          $env:PKM_RELEASE_URL = "$env:RUNNER_TEMP\rel"
          $env:PKM_SETUP_ARGS = "--yes --claude-config $env:RUNNER_TEMP\claude.json --vault $env:RUNNER_TEMP\vault"
          & "$env:RUNNER_TEMP\stamped\install.ps1"
          & "$env:USERPROFILE\.local\bin\pkm.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:PKM_RELEASE_URL = "$env:RUNNER_TEMP\bad"
          $failed = $false
          try { & "$env:RUNNER_TEMP\stamped\install.ps1" } catch { $failed = $true; Write-Host "Expected: $_" }
          if (-not $failed) { Write-Host "A tampered wheel was installed"; exit 1 }
