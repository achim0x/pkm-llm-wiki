# Update proposals for the Python dependencies of pkm-tools and for the GitHub Actions: one pull
# request per ecosystem and run (groups), weekly.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/pkm-tools"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
